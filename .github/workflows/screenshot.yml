name: Screenshots
# Builds NetFinder and takes pictures of the main window with made-up demo devices (light and dark).
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  shots:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet publish src/NetFinder/NetFinder.csproj -c Release -o dist
      - name: Bigger screen
        shell: pwsh
        continue-on-error: true
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - name: Screenshots
        shell: pwsh
        run: |
          $env:NETFINDER_DEMO = "1"
          # normal text, then every font 1.5x bigger (checks that no text gets cut)
          foreach ($run in @(@{ dir = "shots"; scale = "" }, @{ dir = "shots\big-text"; scale = "1.5" })) {
            New-Item -ItemType Directory -Force $run.dir | Out-Null
            $env:NETFINDER_SCREENSHOT = Join-Path $PWD $run.dir
            $env:NETFINDER_TEXT_SCALE = $run.scale
            $p = Start-Process dist\NetFinder.exe -PassThru
            if (-not $p.WaitForExit(200000)) { $p.Kill(); Write-Host "timed out" }
            Get-ChildItem $run.dir
            if (Test-Path "$($run.dir)\error.txt") { Get-Content "$($run.dir)\error.txt" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/*
      # the pictures also go to the "screenshots" branch (one commit, replaced each run), to view them without downloading the artifact
      - name: Save to the screenshots branch
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Set-Location shots
          git init -q
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -q -b screenshots
          git add -A
          git commit -q -m "Screenshots of $env:GITHUB_REF_NAME $env:GITHUB_SHA"
          git push -q -f "https://x-access-token:$env:GH_TOKEN@github.com/$env:GITHUB_REPOSITORY.git" screenshots
