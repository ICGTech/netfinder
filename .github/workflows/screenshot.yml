name: Screenshots
# Builds NetFinder and takes pictures of the main window with made-up demo devices (light and dark).
on:
  workflow_dispatch:
jobs:
  shots:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet publish src/NetFinder/NetFinder.csproj -c Release -o dist
      - name: Bigger screen
        shell: pwsh
        continue-on-error: true
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - name: Screenshots
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force shots | Out-Null
          $env:NETFINDER_DEMO = "1"
          $env:NETFINDER_SCREENSHOT = "$PWD\shots"
          $p = Start-Process dist\NetFinder.exe -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); Write-Host "timed out" }
          Get-ChildItem shots
          if (Test-Path shots\error.txt) { Get-Content shots\error.txt }
          if (Test-Path shots\info.txt) { Get-Content shots\info.txt }
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/*
